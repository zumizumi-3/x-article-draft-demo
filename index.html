<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X Article Draft Demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --surface: #ffffff;
        --surface-soft: #eef3f7;
        --ink: #17202a;
        --muted: #5f6b7a;
        --line: #d8dee7;
        --accent: #0b7a75;
        --accent-strong: #075f5b;
        --accent-soft: #dcefed;
        --warn: #9a6212;
        --warn-soft: #fff4d7;
        --blue: #255f99;
        --blue-soft: #e4eff8;
        --shadow: 0 18px 40px rgba(23, 32, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        min-height: 36px;
        padding: 0 12px;
        border-radius: 8px;
        cursor: pointer;
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      button.icon {
        width: 36px;
        padding: 0;
        display: inline-grid;
        place-items: center;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: 56px 1fr;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(12px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: var(--ink);
        color: white;
        font-size: 13px;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(320px, 0.88fr) minmax(440px, 1.12fr) minmax(280px, 0.72fr);
        gap: 16px;
        padding: 16px;
        min-height: 0;
      }

      .panel {
        min-width: 0;
        min-height: calc(100vh - 88px);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .panel-header {
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }

      .panel-title {
        min-width: 0;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 15px;
        line-height: 1.2;
      }

      h2 {
        font-size: 14px;
        line-height: 1.2;
      }

      h3 {
        font-size: 13px;
        line-height: 1.3;
      }

      .subtle {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
        margin-top: 3px;
      }

      .panel-body {
        padding: 14px;
        overflow: auto;
      }

      .form-grid {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--ink);
        padding: 10px 11px;
        outline: none;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      textarea {
        min-height: 260px;
        resize: vertical;
        line-height: 1.55;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 120px;
        gap: 10px;
      }

      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface-soft);
      }

      .segmented button {
        border: 0;
        border-radius: 0;
        background: transparent;
      }

      .segmented button.active {
        background: var(--accent);
        color: white;
      }

      .preview-title {
        font-size: 28px;
        line-height: 1.15;
        letter-spacing: 0;
        margin-bottom: 18px;
      }

      .article {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 4px 32px;
      }

      .paragraph-block {
        position: relative;
        padding: 10px 0;
      }

      .paragraph-block p {
        font-size: 16px;
        line-height: 1.72;
      }

      .slot {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfd;
        margin: 12px 0 18px;
        overflow: hidden;
      }

      .slot-art {
        height: 180px;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(11, 122, 117, 0.18), rgba(37, 95, 153, 0.12)),
          repeating-linear-gradient(
            -35deg,
            rgba(23, 32, 42, 0.04),
            rgba(23, 32, 42, 0.04) 8px,
            rgba(255, 255, 255, 0.2) 8px,
            rgba(255, 255, 255, 0.2) 16px
          );
      }

      .slot-art span {
        width: 54px;
        height: 54px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid var(--line);
        color: var(--accent-strong);
        font-size: 24px;
      }

      .slot-meta {
        padding: 11px 12px;
        display: grid;
        gap: 4px;
      }

      .slot-meta p {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .item {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 11px;
        background: white;
      }

      .item-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        margin-bottom: 6px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--blue-soft);
        color: var(--blue);
        font-size: 11px;
        white-space: nowrap;
      }

      .badge.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }

      .instruction {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .copy-strip {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: var(--surface-soft);
        margin-bottom: 12px;
      }

      .meter {
        height: 8px;
        border-radius: 999px;
        background: var(--surface-soft);
        overflow: hidden;
      }

      .meter span {
        display: block;
        height: 100%;
        width: 64%;
        background: var(--accent);
      }

      @media (max-width: 1180px) {
        .workspace {
          grid-template-columns: minmax(320px, 0.9fr) minmax(420px, 1.1fr);
        }

        .right-panel {
          grid-column: 1 / -1;
          min-height: auto;
        }
      }

      @media (max-width: 820px) {
        .topbar {
          padding: 0 12px;
        }

        .workspace {
          grid-template-columns: 1fr;
          padding: 10px;
        }

        .panel {
          min-height: auto;
        }

        .row {
          grid-template-columns: 1fr;
        }

        .preview-title {
          font-size: 23px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">XA</div>
          <div>
            <h1>X Article Draft Demo</h1>
            <p class="subtle">Public preview workspace</p>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon" title="Undo">↶</button>
          <button class="icon" title="Redo">↷</button>
          <button>保存</button>
          <button class="primary">下書き生成</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="panel">
          <div class="panel-header">
            <div class="panel-title">
              <h2>入力</h2>
              <p class="subtle">本文と画像生成方針</p>
            </div>
          </div>
          <div class="panel-body">
            <div class="form-grid">
              <label>
                記事タイトル
                <input id="titleInput" value="X ArticlesをAPIなしで半自動化する設計" />
              </label>

              <label>
                本文
                <textarea id="bodyInput">X Articlesは公開APIから直接投稿できないため、現実的には下書きをローカルで生成して編集画面へ貼り込む設計になる。

重要なのは、本文と画像を別々に考えないこと。画像は各セクションの主張を補強する位置に置く。

まず本文を段落単位に分割し、どの段落の後に画像が必要かを決める。自動モードでは本文の流れから候補位置を提案する。

最後に貼り付け順を作る。オペレーターは本文、画像、本文の順で確認しながらX Articlesへ移せる。</textarea>
              </label>

              <div class="row">
                <label>
                  画像配置
                  <div class="segmented" aria-label="画像配置モード">
                    <button class="active" type="button" data-mode="auto">自動</button>
                    <button type="button" data-mode="manual">手動</button>
                  </div>
                </label>
                <label>
                  生成枚数
                  <select id="maxImages">
                    <option>4</option>
                    <option>8</option>
                    <option selected value="all">全センテンス</option>
                  </select>
                </label>
              </div>

              <label>
                画像スタイル
                <input value="clean editorial illustration, product UI detail, no stock photo" />
              </label>

              <button class="primary" id="regenerateButton" type="button">プレビュー更新</button>
            </div>
          </div>
        </aside>

        <section class="panel">
          <div class="panel-header">
            <div class="panel-title">
              <h2>記事プレビュー</h2>
              <p class="subtle">X Articles貼り込み前の構成確認</p>
            </div>
            <div class="toolbar-group">
              <button>本文コピー</button>
              <button>HTMLコピー</button>
            </div>
          </div>
          <div class="panel-body">
            <div class="copy-strip">
              <div>
                <h3>Draft status</h3>
                <p class="subtle" id="statusLine">mock_ready</p>
              </div>
              <span class="badge">X Article</span>
            </div>
            <article class="article" id="articlePreview"></article>
          </div>
        </section>

        <aside class="panel right-panel">
          <div class="panel-header">
            <div class="panel-title">
              <h2>差し込み計画</h2>
              <p class="subtle">貼り付け順と画像プロンプト</p>
            </div>
          </div>
          <div class="panel-body">
            <div class="list" id="pastePlan"></div>
          </div>
        </aside>
      </section>
    </main>

    <script>
      const titleInput = document.querySelector("#titleInput");
      const bodyInput = document.querySelector("#bodyInput");
      const maxImages = document.querySelector("#maxImages");
      const preview = document.querySelector("#articlePreview");
      const pastePlan = document.querySelector("#pastePlan");
      const regenerateButton = document.querySelector("#regenerateButton");
      const statusLine = document.querySelector("#statusLine");

      function segmentBody(body) {
        return body
          .split(/\n{2,}/)
          .flatMap((paragraph) =>
            paragraph
              .trim()
              .split(/(?<=[。！？!?\.])\s+/)
              .map((text) => text.trim())
          )
          .filter(Boolean)
          .map((text, index) => ({
            id: `seg-${index + 1}`,
            order: index + 1,
            text
          }));
      }

      function inferPurpose(text) {
        const normalized = text.toLowerCase();
        if (normalized.includes("api")) return "API制約と代替ルートの図解";
        if (normalized.includes("画像")) return "本文と画像の関係を示す構成図";
        if (normalized.includes("貼り付け")) return "オペレーター向け貼り付けフロー";
        return "セクション要約ビジュアル";
      }

      function buildDraft() {
        const segments = segmentBody(bodyInput.value);
        const imageCount = maxImages.value === "all" ? segments.length : Number(maxImages.value);
        const imageSegments = segments.slice(0, imageCount);
        const images = imageSegments.map((segment, index) => ({
          id: `img-${index + 1}`,
          afterSegmentId: segment.id,
          filename: `article-image-${String(index + 1).padStart(2, "0")}.png`,
          purpose: inferPurpose(segment.text),
          prompt: `Create a clean editorial illustration for an X Article. Purpose: ${inferPurpose(
            segment.text
          )}. Anchor paragraph: ${segment.text.slice(0, 120)}`
        }));

        return {
          title: titleInput.value.trim() || "Untitled",
          segments,
          images
        };
      }

      function render() {
        const draft = buildDraft();
        statusLine.textContent = `mock_ready ・ ${draft.segments.length} segments ・ ${draft.images.length} image slots`;
        const imagesBySegment = new Map();
        draft.images.forEach((image) => {
          imagesBySegment.set(image.afterSegmentId, image);
        });

        preview.innerHTML = `
          <h1 class="preview-title">${escapeHtml(draft.title)}</h1>
          ${draft.segments
            .map((segment) => {
              const image = imagesBySegment.get(segment.id);
              return `
                <section class="paragraph-block">
                  <p>${escapeHtml(segment.text)}</p>
                </section>
                ${
                  image
                    ? `<section class="slot">
                        <div class="slot-art"><span>▧</span></div>
                        <div class="slot-meta">
                          <h3>${escapeHtml(image.filename)}</h3>
                          <p>${escapeHtml(image.purpose)}</p>
                        </div>
                      </section>`
                    : ""
                }
              `;
            })
            .join("")}
        `;

        const steps = draft.segments.flatMap((segment) => {
          const base = [
            {
              kind: "text",
              label: `本文 ${segment.order}`,
              instruction: segment.text
            }
          ];
          const image = imagesBySegment.get(segment.id);
          return image
            ? [
                ...base,
                {
                  kind: "image",
                  label: image.filename,
                  instruction: image.prompt
                }
              ]
            : base;
        });

        pastePlan.innerHTML = steps
          .map(
            (step, index) => `
              <section class="item">
                <div class="item-head">
                  <h3>${index + 1}. ${escapeHtml(step.label)}</h3>
                  <span class="badge ${step.kind === "image" ? "warn" : ""}">${step.kind}</span>
                </div>
                <p class="instruction">${escapeHtml(step.instruction)}</p>
                ${step.kind === "image" ? '<div class="meter" aria-hidden="true"><span></span></div>' : ""}
              </section>
            `
          )
          .join("");
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (char) => {
          const entities = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          };
          return entities[char];
        });
      }

      regenerateButton.addEventListener("click", render);
      titleInput.addEventListener("input", render);
      bodyInput.addEventListener("input", render);
      maxImages.addEventListener("change", render);
      render();
    </script>
  </body>
</html>
